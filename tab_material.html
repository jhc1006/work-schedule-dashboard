<!-- ==========================================================================
     TAB CONTENT MODULE 3: [자재관리] PANEL (tab_material.html)
     ========================================================================== -->
<div class="tab-panel-content" id="tabPanelMaterialContent">
  <!-- Material KPI Summary Cards -->
  <section class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-icon total">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
        </svg>
      </div>
      <div class="kpi-content">
        <span class="kpi-title">총 보유 자재 품목</span>
        <span class="kpi-value" id="kpiTotalMaterial">0종</span>
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon present">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div class="kpi-content">
        <span class="kpi-title">정상 재고</span>
        <span class="kpi-value text-success" id="kpiStockOk">0종</span>
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon late">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
        </svg>
      </div>
      <div class="kpi-content">
        <span class="kpi-title">재고 부족 경고</span>
        <span class="kpi-value text-danger" id="kpiStockLow">0종</span>
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon leave">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0C.68 5.58.25 6.06.25 6.628v.958m16 0v.958c0 .568-.422 1.048-.987 1.106a48.554 48.554 0 01-10.026 0C4.68 9.58 4.25 9.1 4.25 8.532v-.958" />
        </svg>
      </div>
      <div class="kpi-content">
        <span class="kpi-title">당일 입출고 수량</span>
        <span class="kpi-value text-purple" id="kpiTodayTx">0건</span>
      </div>
    </div>
  </section>

  <!-- Material Toolbar -->
  <section class="toolbar-card">
    <div class="filter-group">
      <select id="materialCategoryFilter" class="filter-select" aria-label="자재 카테고리 필터">
        <option value="">모든 자재 카테고리</option>
        <option value="설비자재">설비자재</option>
        <option value="물류포장재">물류포장재</option>
        <option value="인프라소모품">인프라소모품</option>
      </select>

      <select id="materialStockFilter" class="filter-select" aria-label="재고 상태 필터">
        <option value="">모든 재고 상태</option>
        <option value="정상재고">정상재고</option>
        <option value="재고부족">재고부족</option>
        <option value="입고대기">입고대기</option>
      </select>
    </div>

    <div class="action-group">
      <button type="button" class="btn btn-outline" id="btnMaterialExportCsv">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
        </svg>
        자재 재고 CSV 다운로드
      </button>
      <button type="button" class="btn btn-primary" id="btnAddMaterial">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        신규 자재 등록 / 재고 조정
      </button>
    </div>
  </section>

  <!-- Material Table Card -->
  <section class="table-card">
    <div class="table-wrapper">
      <table class="schedule-table" id="materialTable">
        <thead>
          <tr>
            <th class="col-select center">
              <input type="checkbox" id="selectAllMaterial" aria-label="전체 선택">
            </th>
            <th>자재코드</th>
            <th>자재명</th>
            <th>카테고리</th>
            <th>보관장소/창고</th>
            <th class="center">현재재고</th>
            <th class="center">적정재고</th>
            <th class="center">재고상태</th>
            <th class="center">최종입출고일</th>
            <th class="center">관리</th>
          </tr>
        </thead>
        <tbody id="materialTableBody">
          <!-- Rendered dynamically -->
        </tbody>
      </table>
    </div>

    <div class="table-footer-status">
      <span>등록 자재: <strong id="materialFilteredCount">0</strong>종</span>
      <span>현재 재고 수량과 창고 위치를 클릭하여 수정할 수 있습니다.</span>
    </div>
  </section>
</div>
