<!-- ==========================================================================
     TAB CONTENT MODULE 1: [근태현황] PANEL (tab_attendance.html)
     ========================================================================== -->
<div class="tab-panel-content" id="tabPanelAttendanceContent">
  <!-- Attendance KPI Summary Cards -->
  <section class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-icon total">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 10-4.5 0 2.25 2.25 0 004.5 0zm-13.5 0a2.25 2.25 0 10-4.5 0 2.25 2.25 0 004.5 0z" />
        </svg>
      </div>
      <div class="kpi-content">
        <span class="kpi-title">총 근무 인원</span>
        <span class="kpi-value" id="kpiTotalStaff">0명</span>
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon present">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div class="kpi-content">
        <span class="kpi-title">정상 출근</span>
        <span class="kpi-value text-success" id="kpiPresentCount">0명</span>
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon late">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div class="kpi-content">
        <span class="kpi-title">지각 / 조퇴</span>
        <span class="kpi-value text-warning" id="kpiLateCount">0명</span>
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon leave">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 9v7.5" />
        </svg>
      </div>
      <div class="kpi-content">
        <span class="kpi-title">연차 / 휴가</span>
        <span class="kpi-value text-purple" id="kpiLeaveCount">0명</span>
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-icon trip">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6h1.5m-1.5 3h1.5m-1.5 3h1.5" />
        </svg>
      </div>
      <div class="kpi-content">
        <span class="kpi-title">출장 / 공가</span>
        <span class="kpi-value text-primary" id="kpiTripCount">0명</span>
      </div>
    </div>
  </section>

  <!-- Attendance Toolbar -->
  <section class="toolbar-card">
    <div class="filter-group">
      <select id="attendanceStatusFilter" class="filter-select" aria-label="근태 상태 필터">
        <option value="">모든 근태상태</option>
        <option value="정상출근">정상출근</option>
        <option value="지각">지각</option>
        <option value="연차">연차</option>
        <option value="반차">반차</option>
        <option value="출장">출장</option>
        <option value="조퇴">조퇴</option>
      </select>

      <select id="attendanceDeptFilter" class="filter-select" aria-label="부서 필터">
        <option value="">모든 부서</option>
        <option value="시설관리팀">시설관리팀</option>
        <option value="물류운영팀">물류운영팀</option>
        <option value="인프라점검팀">인프라점검팀</option>
        <option value="안전보안팀">안전보안팀</option>
      </select>
    </div>

    <div class="action-group">
      <button type="button" class="btn btn-outline" id="btnAttendanceExportCsv">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
        </svg>
        근태 CSV 다운로드
      </button>
      <button type="button" class="btn btn-primary" id="btnAddAttendance">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        근태 등록 / 출퇴근 처리
      </button>
    </div>
  </section>

  <!-- Attendance Table -->
  <section class="table-card">
    <div class="table-wrapper">
      <table class="schedule-table" id="attendanceTable">
        <thead>
          <tr>
            <th class="col-select center">
              <input type="checkbox" id="selectAllAttendance" aria-label="전체 선택">
            </th>
            <th>사원번호</th>
            <th>성명</th>
            <th>부서</th>
            <th>직급 / 사업장</th>
            <th class="center">출근시간</th>
            <th class="center">퇴근시간</th>
            <th class="center">근태상태</th>
            <th>비고 및 특이사항</th>
            <th class="center">관리</th>
          </tr>
        </thead>
        <tbody id="attendanceTableBody">
          <!-- Rendered dynamically -->
        </tbody>
      </table>
    </div>

    <div class="table-footer-status">
      <span>조회된 근무자: <strong id="attendanceFilteredCount">0</strong>명</span>
      <span>출퇴근 시간 및 상태를 클릭하여 수정할 수 있습니다.</span>
    </div>
  </section>
</div>
